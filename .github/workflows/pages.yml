name: Publish Yuvglobal website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 16,20 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Refresh official currency references
        run: node scripts/update-fx.cjs
      - name: Test newsroom and build public site
        run: |
          node --test tests/*.test.cjs
          node scripts/build-site.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify deployed public site and courier service
        run: node scripts/check-live-site.cjs
